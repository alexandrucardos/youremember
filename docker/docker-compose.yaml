name: "be-youremember"

services:
  youremember-nginx:
    restart: always
    build:
      context: ./../
      dockerfile: docker/nginx/Dockerfile
      args:
        ENVIRONMENT: docker-sql
    container_name: youremember-nginx
    environment:
      COUNTRY_CODE: ro
      ENVIRONMENT: dev
    volumes:
      - type: bind
        source: ./../public
        target: /var/www/youremember/public
    networks:
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.youremember.entrypoints=web'
      - "traefik.http.routers.youremember.rule=Host(`youremember.localhost`)"
      - 'traefik.docker-sql.network=proxy'
      - 'traefik.http.services.youremember.loadbalancer.server.port=80'
    depends_on:
      - youremember-php

  youremember-php:
    restart: always
    build:
      context: ./../
      dockerfile: docker/php-fpm/Dockerfile
      args:
        ENVIRONMENT: docker-sql
    container_name: youremember-phpfpm
    volumes:
      - "~/.gitconfig:/etc/gitconfig"
      - "~/.aws/credentials:/root/.aws/credentials"
      - type: bind
        source: ./../
        target: /var/www/youremember
    environment:
      ENVIRONMENT: docker-sql
      COUNTRY_CODE: ro
      APP_ENV: dev
    networks:
      - proxy

networks:
  proxy:
    external: true
